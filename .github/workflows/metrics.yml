# Builds the stats and achievements images for the profile README.
# Runs every day, on every push to main, and on demand (Actions tab -> Run workflow).
name: GitHub Metrics

on:
  schedule:
    - cron: "30 0 * * *"   # every day at 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "metrics/**"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Profile stats + most used languages
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vamshi-987
          filename: metrics/stats.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

      # 3D contribution calendar for the last year
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vamshi-987
          filename: metrics/calendar.svg
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year